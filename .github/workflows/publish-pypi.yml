name: Publish mayalok to PyPI
on:
  release: { types: [published] }
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }  # PyPI trusted publishing, no token stored
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
        working-directory: pipeline
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: pipeline/dist }
