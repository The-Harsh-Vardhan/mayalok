[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namma"
version = "0.1.0"
description = "Namma Space: smartphone capture -> navigable 3D digital twin pipeline"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# pycolmap is optional because Colab installs the CUDA build (pycolmap-cuda12)
# instead, and both provide the same `pycolmap` module.
sfm = ["pycolmap>=4.0"]
test = ["pytest>=8", "pycolmap>=4.0"]

[project.scripts]
namma = "namma.cli:main"

[tool.setuptools.packages.find]
include = ["namma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real feature extraction/matching/mapping (~1 min on CPU)"]
