<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="system-context-title system-context-desc">
<title id="system-context-title">Mayalok system context</title><desc id="system-context-desc">A smartphone walkthrough is processed by the Mayalok pipeline into a static scene bundle hosted on Vercel and explored by browser users.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2ec5ff"/></marker><style>.bg{fill:#0b0f17}.zone{fill:#111927;stroke:#29384e;stroke-width:2;stroke-dasharray:8 8}.box{fill:#121c2b;stroke:#3a5270;stroke-width:2}.focus{fill:#14283a;stroke:#2ec5ff;stroke-width:3}.ext{fill:#19152c;stroke:#9575ff;stroke-width:2}.t{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#e9eef7}.h{font:700 25px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.s{font:16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#aebdd0}.k{font:700 13px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2px;fill:#2ec5ff}.l{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#9cb1c9}.arrow{fill:none;stroke:#2ec5ff;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#9575ff;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs>
<rect class="bg" width="1600" height="900"/><text x="72" y="72" class="k">SYSTEM CONTEXT</text><text x="72" y="116" class="h" font-size="38">Mayalok: capture to navigable digital twin</text><text x="72" y="148" class="s">Offline reconstruction, static delivery, in-browser rendering and navigation</text>
<rect x="64" y="224" width="256" height="260" rx="12" class="ext"/><text x="96" y="268" class="k">CAPTURE</text><text x="96" y="314" class="h">Phone / camera</text><text x="96" y="346" class="s">walkthrough.mp4</text><text x="96" y="374" class="s">or image sequence</text><text x="96" y="430" class="l">Optional printed ArUco markers</text>
<rect x="404" y="192" width="412" height="320" rx="12" class="zone"/><text x="436" y="228" class="k">OFFLINE · PYTHON 3.10+</text><rect x="436" y="260" width="348" height="188" rx="10" class="focus"/><text x="468" y="308" class="h">mayalok CLI</text><text x="468" y="340" class="s">build · process-splat · synthetic</text><text x="468" y="378" class="l">frames → SfM → align → train → clean</text><text x="468" y="406" class="l">navgrid → minimap → export</text>
<rect x="900" y="224" width="292" height="260" rx="12" class="zone"/><text x="932" y="268" class="k">STATIC HOSTING</text><rect x="932" y="296" width="228" height="132" rx="10" class="focus"/><text x="964" y="342" class="h">Vercel</text><text x="964" y="374" class="s">Vite dist + /scenes</text><text x="964" y="402" class="l">static JSON, PNG, SPZ</text>
<rect x="1276" y="192" width="260" height="320" rx="12" class="zone"/><text x="1308" y="228" class="k">CLIENT</text><rect x="1308" y="260" width="196" height="188" rx="10" class="focus"/><text x="1340" y="308" class="h">Browser viewer</text><text x="1340" y="340" class="s">React + Three.js</text><text x="1340" y="370" class="s">Spark.js splats</text><text x="1340" y="406" class="l">A* in Web Worker</text>
<rect x="1276" y="620" width="260" height="144" rx="12" class="ext"/><text x="1308" y="662" class="k">PEOPLE</text><text x="1308" y="708" class="h">Venue visitors</text><text x="1308" y="738" class="s">search · walk · navigate</text>
<path d="M320 354H404" class="arrow"/><text x="332" y="334" class="l">video / images</text><path d="M816 354H900" class="arrow"/><text x="826" y="334" class="l">scene bundle</text><path d="M1192 354H1276" class="arrow"/><text x="1202" y="334" class="l">HTTPS assets</text><path d="M1406 620V512" class="dash"/><text x="1422" y="578" class="l">interacts</text>
<line x1="72" y1="824" x2="1528" y2="824" stroke="#29384e"/><text x="72" y="856" class="l">World convention: metres · +Y up · floor Y=0 · Manhattan-aligned X/Z</text><text x="1050" y="856" class="l">Static site: no runtime backend required</text>
</svg>
