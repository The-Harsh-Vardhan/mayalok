<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="runtime-components-title runtime-components-desc"><title id="runtime-components-title">Mayalok browser runtime components</title><desc id="runtime-components-desc">The React application loads a scene bundle, coordinates rendering, search and routing, and updates navigation UI through a Web Worker.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2ec5ff"/></marker><style>.bg{fill:#0b0f17}.z{fill:#101927;stroke:#29384e;stroke-width:2;stroke-dasharray:8 8}.b{fill:#121c2b;stroke:#3a5270;stroke-width:2}.f{fill:#14283a;stroke:#2ec5ff;stroke-width:3}.w{fill:#1b1530;stroke:#9575ff;stroke-width:3}.h{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.s{font:15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#aebdd0}.k{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2px;fill:#2ec5ff}.a{fill:none;stroke:#2ec5ff;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#9575ff;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#a)}</style></defs><rect class="bg" width="1600" height="980"/><text x="64" y="68" class="k">BROWSER RUNTIME</text><text x="64" y="112" class="h" font-size="38">Components and data flow</text><rect x="52" y="180" width="420" height="660" rx="12" class="z"/><text x="80" y="216" class="k">REACT UI</text><rect x="84" y="252" width="160" height="112" rx="8" class="f"/><text x="104" y="292" class="h">SearchBar</text><text x="104" y="320" class="s">createPoiSearch</text><rect x="280" y="252" width="160" height="112" rx="8" class="b"/><text x="300" y="292" class="h">PoiCard</text><text x="300" y="320" class="s">select / navigate</text><rect x="84" y="432" width="160" height="112" rx="8" class="b"/><text x="104" y="472" class="h">NavHud</text><text x="104" y="500" class="s">instructions</text><rect x="280" y="432" width="160" height="112" rx="8" class="b"/><text x="300" y="472" class="h">Minimap</text><text x="300" y="500" class="s">route + POIs</text><rect x="84" y="612" width="356" height="128" rx="8" class="b"/><text x="104" y="654" class="h">App state / callbacks</text><text x="104" y="684" class="s">selected POI · player state · active route</text><text x="104" y="712" class="s">autopilot + replan coordination</text>
<rect x="536" y="180" width="500" height="660" rx="12" class="z"/><text x="564" y="216" class="k">ENGINE</text><rect x="568" y="252" width="436" height="140" rx="8" class="f"/><text x="592" y="294" class="h">Viewer</text><text x="592" y="324" class="s">Three.js scene, camera, CSS2DRenderer, Spark SplatMesh</text><text x="592" y="354" class="s">tick(): controls · POIs · route · renderer</text><rect x="568" y="456" width="196" height="120" rx="8" class="b"/><text x="592" y="496" class="h">PlayerControls</text><text x="592" y="524" class="s">collision + autopilot</text><text x="592" y="548" class="s">eyeHeight 1.6 m</text><rect x="808" y="456" width="196" height="120" rx="8" class="b"/><text x="832" y="496" class="h">PoiLayer</text><text x="832" y="524" class="s">labels + pick / zone</text><rect x="568" y="648" width="436" height="92" rx="8" class="b"/><text x="592" y="688" class="h">PathLayer</text><text x="592" y="716" class="s">route ribbon; dimmed behind navgrid occlusion</text>
<rect x="1100" y="180" width="448" height="660" rx="12" class="z"/><text x="1128" y="216" class="k">LIBRARIES + WORKER</text><rect x="1132" y="252" width="384" height="112" rx="8" class="b"/><text x="1156" y="292" class="h">sceneLoader.loadScene</text><text x="1156" y="320" class="s">scene.json + navgrid + pois + minimap</text><rect x="1132" y="432" width="180" height="112" rx="8" class="b"/><text x="1156" y="472" class="h">search.ts</text><text x="1156" y="500" class="s">Fuse.js index</text><rect x="1336" y="432" width="180" height="112" rx="8" class="b"/><text x="1360" y="472" class="h">Router</text><text x="1360" y="500" class="s">worker client</text><rect x="1132" y="620" width="384" height="120" rx="8" class="w"/><text x="1156" y="660" class="h">pathWorker.ts</text><text x="1156" y="688" class="s">NavGrid.fromJSON → planRoute (A*)</text><text x="1156" y="716" class="s">smoothPath → buildInstructions</text>
