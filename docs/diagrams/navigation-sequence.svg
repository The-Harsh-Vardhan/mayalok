<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="navigation-sequence-title navigation-sequence-desc"><title id="navigation-sequence-title">Mayalok navigation sequence</title><desc id="navigation-sequence-desc">A visitor searches and selects a POI, the routing worker plans an A-star route, the viewer renders it, and the controls can auto-walk it.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2ec5ff"/></marker><style>.bg{fill:#0b0f17}.h{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.s{font:15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#aebdd0}.k{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2px;fill:#2ec5ff}.life{stroke:#3a5270;stroke-width:2;stroke-dasharray:8 8}.b{fill:#121c2b;stroke:#3a5270;stroke-width:2}.w{fill:#1b1530;stroke:#9575ff;stroke-width:2}.a{fill:none;stroke:#2ec5ff;stroke-width:3;marker-end:url(#a)}.r{fill:none;stroke:#9575ff;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs><rect class="bg" width="1600" height="900"/><text x="64" y="68" class="k">SEQUENCE</text><text x="64" y="112" class="h" font-size="38">Search to route to auto-walk</text>
<g><rect x="90" y="172" width="150" height="64" rx="8" class="b"/><text x="124" y="212" class="h">Visitor</text><line x1="165" y1="236" x2="165" y2="824" class="life"/><rect x="350" y="172" width="180" height="64" rx="8" class="b"/><text x="378" y="212" class="h">SearchBar</text><line x1="440" y1="236" x2="440" y2="824" class="life"/><rect x="650" y="172" width="150" height="64" rx="8" class="b"/><text x="688" y="212" class="h">App</text><line x1="725" y1="236" x2="725" y2="824" class="life"/><rect x="930" y="172" width="180" height="64" rx="8" class="w"/><text x="958" y="212" class="h">pathWorker</text><line x1="1020" y1="236" x2="1020" y2="824" class="life"/><rect x="1240" y="172" width="210" height="64" rx="8" class="b"/><text x="1268" y="212" class="h">Viewer / controls</text><line x1="1345" y1="236" x2="1345" y2="824" class="life"/></g>
<path d="M165 300H440" class="a"/><text x="260" y="284" class="s">type query</text><path d="M440 360H165" class="r"/><text x="254" y="344" class="s">Fuse.js ranked POIs</text><path d="M165 420H440" class="a"/><text x="248" y="404" class="s">choose POI / Go</text><path d="M440 480H725" class="a"/><text x="516" y="464" class="s">onNavigate(poi)</text><path d="M725 540H1020" class="a"/><text x="786" y="524" class="s">route(start, goal)</text><path d="M1020 600H725" class="r"/><text x="766" y="584" class="s">Route: points, length, instructions</text><path d="M725 660H1345" class="a"/><text x="926" y="644" class="s">showRoute(points, destination)</text><path d="M165 720H1345" class="a"/><text x="630" y="704" class="s">press F / Auto-walk</text><path d="M1345 780V812" class="a"/><text x="1370" y="804" class="s">startAutopilot(points)</text><text x="72" y="862" class="s">Worker route planning uses `planRoute`: nearest walkable cells → A* → line-of-sight smoothing → turn instructions. Manual input stops autopilot.</text></svg>
