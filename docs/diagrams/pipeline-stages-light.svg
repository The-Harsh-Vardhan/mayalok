<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="pipeline-stages-title pipeline-stages-desc"><title id="pipeline-stages-title">Mayalok reconstruction pipeline stages</title><desc id="pipeline-stages-desc">Eight Mayalok pipeline stages turn capture frames into a static scene bundle with a Gaussian splat, navigation grid, minimap and metadata.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#0a86c2"/></marker><style>.bg{fill:#ffffff}.b{fill:#f4f8fc;stroke:#9fb3c8;stroke-width:2}.f{fill:#eaf4fb;stroke:#0a86c2;stroke-width:3}.t{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f1b2d}.h{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f1b2d}.s{font:15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4a5d75}.k{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2px;fill:#0a86c2}.a{stroke:#0a86c2;stroke-width:3;fill:none;marker-end:url(#a)}.v{stroke:#c9d6e4;stroke-width:2}.note{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#5a3fc8}</style></defs><rect class="bg" width="1600" height="980"/><text x="64" y="68" class="k">OFFLINE PIPELINE</text><text x="64" y="112" class="h" font-size="38">Mayalok build stages and durable outputs</text><text x="64" y="144" class="s">`run_build()` calls SfM, alignment and training; `finish_scene()` cleans, grids and exports.</text>
<path d="M230 354H270M430 354H470M630 354H670M830 354H870M1030 354H1070M1230 354H1270M1430 354H1470" class="a"/>
<g><rect x="70" y="268" width="160" height="172" rx="10" class="b"/><text x="90" y="300" class="k">01 · FRAMES</text><text x="90" y="334" class="h">extract_frames</text><text x="90" y="366" class="s">INPUT</text><text x="90" y="390" class="t">.mp4 / .mov /</text><text x="90" y="412" class="t">.jpg / .png</text><text x="90" y="468" class="note">OUTPUT: images/*.jpg</text></g>
<g><rect x="270" y="268" width="160" height="172" rx="10" class="b"/><text x="290" y="300" class="k">02 · SFM</text><text x="290" y="334" class="h">pycolmap</text><text x="290" y="362" class="s">extract_and_match</text><text x="290" y="390" class="s">map_poses · undistort</text><text x="290" y="468" class="note">sparse/ + dataset/</text></g>
<g><rect x="470" y="268" width="160" height="172" rx="10" class="f"/><text x="490" y="300" class="k">03 · ALIGN</text><text x="490" y="334" class="h">align_recon…</text><text x="490" y="366" class="s">floor, scale, yaw</text><text x="490" y="392" class="note">ArUco or 1.35 m SOP</text><text x="490" y="468" class="note">metric cameras.json</text></g>
<g><rect x="670" y="268" width="160" height="172" rx="10" class="b"/><text x="690" y="300" class="k">04 · TRAIN</text><text x="690" y="334" class="h">train_gsplat</text><text x="690" y="366" class="s">or Brush 3DGS</text><text x="690" y="394" class="s">30,000 steps default</text><text x="690" y="468" class="note">point_cloud.ply</text></g>
<g><rect x="870" y="268" width="160" height="172" rx="10" class="b"/><text x="890" y="300" class="k">05 · CLEAN</text><text x="890" y="334" class="h">clean_splats</text><text x="890" y="366" class="s">opacity / distance</text><text x="890" y="392" class="s">refine floor offset</text><text x="890" y="468" class="note">cleaned .ply</text></g>
<g><rect x="1070" y="268" width="160" height="172" rx="10" class="f"/><text x="1090" y="300" class="k">06 · NAVGRID</text><text x="1090" y="334" class="h">build_navgrid</text><text x="1090" y="366" class="s">0.05 m cells</text><text x="1090" y="392" class="s">0.25 m radius</text><text x="1090" y="468" class="note">navgrid.json + .png</text></g>
<g><rect x="1270" y="268" width="160" height="172" rx="10" class="b"/><text x="1290" y="300" class="k">07 · EXPORT</text><text x="1290" y="334" class="h">write_scene</text><text x="1290" y="366" class="s">convert_splat</text><text x="1290" y="392" class="s">splat-transform</text><text x="1290" y="468" class="note">scene.spz + manifest</text></g>
<g><rect x="1470" y="268" width="100" height="172" rx="10" class="b"/><text x="1490" y="300" class="k">08</text><text x="1490" y="334" class="h">QC</text><text x="1490" y="366" class="s">Report</text><text x="1490" y="468" class="note">.json</text></g>
<line x1="70" y1="548" x2="1530" y2="548" class="v"/><text x="70" y="594" class="k">SCENE FOLDER OUTPUT · web/public/scenes/&lt;id&gt;/</text><text x="70" y="636" class="h">scene.spz · scene.json · navgrid.json · minimap.png · pois.json · report.json</text><text x="70" y="678" class="s">`pois.json` is copied from `--pois` when supplied, otherwise created as an empty version 1 POI file.</text><text x="70" y="750" class="k">NAVGRID RULE</text><text x="70" y="782" class="s">Floor must be free from 0.12–1.9 m; obstacle clearance and walked camera path inform walkability. Minimap is rendered at 2 px/cell.</text></svg>
