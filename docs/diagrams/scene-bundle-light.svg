<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="scene-bundle-title scene-bundle-desc"><title id="scene-bundle-title">Mayalok scene bundle</title><desc id="scene-bundle-desc">Files in each static scene folder are produced by the pipeline and consumed by the browser loader, viewer and UI.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#0a86c2"/></marker><style>.bg{fill:#ffffff}.z{fill:#f6f9fc;stroke:#c9d6e4;stroke-width:2;stroke-dasharray:8 8}.b{fill:#f4f8fc;stroke:#9fb3c8;stroke-width:2}.f{fill:#eaf4fb;stroke:#0a86c2;stroke-width:3}.h{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f1b2d}.s{font:15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#4a5d75}.k{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2px;fill:#0a86c2}.a{fill:none;stroke:#0a86c2;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#6a4cdb;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs><rect class="bg" width="1600" height="900"/><text x="64" y="68" class="k">STATIC ASSET CONTRACT</text><text x="64" y="112" class="h" font-size="38">A scene folder is the complete deployable unit</text><rect x="64" y="188" width="280" height="564" rx="12" class="z"/><text x="96" y="228" class="k">PIPELINE PRODUCERS</text><rect x="96" y="276" width="216" height="88" rx="8" class="b"/><text x="120" y="316" class="h">write_scene</text><text x="120" y="342" class="s">manifest + metadata</text><rect x="96" y="404" width="216" height="88" rx="8" class="b"/><text x="120" y="444" class="h">build_navgrid</text><text x="120" y="470" class="s">grid + minimap</text><rect x="96" y="532" width="216" height="88" rx="8" class="b"/><text x="120" y="572" class="h">convert_splat</text><text x="120" y="598" class="s">PLY → SPZ</text><rect x="96" y="660" width="216" height="56" rx="8" class="b"/><text x="120" y="696" class="h">Report</text>
<rect x="444" y="156" width="500" height="636" rx="12" class="z"/><text x="476" y="196" class="k">web/public/scenes/&lt;id&gt;/</text><g><rect x="476" y="232" width="436" height="68" rx="8" class="f"/><text x="500" y="274" class="h">scene.spz</text><text x="700" y="274" class="s">compressed Gaussian splat</text><rect x="476" y="324" width="436" height="68" rx="8" class="b"/><text x="500" y="366" class="h">scene.json</text><text x="700" y="366" class="s">manifest / spawn / frame</text><rect x="476" y="416" width="436" height="68" rx="8" class="b"/><text x="500" y="458" class="h">navgrid.json</text><text x="700" y="458" class="s">walkable + clearance</text><rect x="476" y="508" width="436" height="68" rx="8" class="b"/><text x="500" y="550" class="h">minimap.png</text><text x="700" y="550" class="s">top-down raster map</text><rect x="476" y="600" width="436" height="68" rx="8" class="b"/><text x="500" y="642" class="h">pois.json</text><text x="700" y="642" class="s">POI tags + optional zones</text><rect x="476" y="692" width="436" height="68" rx="8" class="b"/><text x="500" y="734" class="h">report.json</text><text x="700" y="734" class="s">QC metrics + timings</text></g>
<rect x="1044" y="188" width="492" height="564" rx="12" class="z"/><text x="1076" y="228" class="k">BROWSER CONSUMERS</text><rect x="1076" y="276" width="428" height="88" rx="8" class="b"/><text x="1100" y="316" class="h">sceneLoader.loadScene</text><text x="1100" y="342" class="s">loads manifest, navgrid, pois and minimap</text><rect x="1076" y="404" width="200" height="88" rx="8" class="b"/><text x="1100" y="444" class="h">Viewer</text><text x="1100" y="470" class="s">SplatMesh</text><rect x="1304" y="404" width="200" height="88" rx="8" class="b"/><text x="1328" y="444" class="h">Router</text><text x="1328" y="470" class="s">NavGrid</text><rect x="1076" y="532" width="200" height="88" rx="8" class="b"/><text x="1100" y="572" class="h">Minimap</text><text x="1100" y="598" class="s">canvas map</text><rect x="1304" y="532" width="200" height="88" rx="8" class="b"/><text x="1328" y="572" class="h">Search / POIs</text><text x="1328" y="598" class="s">Fuse.js, labels</text><rect x="1076" y="660" width="428" height="56" rx="8" class="b"/><text x="1100" y="696" class="h">StatsPanel: report metrics</text>
