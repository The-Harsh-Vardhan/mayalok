<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="data-model-title data-model-desc"><title id="data-model-title">Mayalok scene JSON data model</title><desc id="data-model-desc">Schema cards describe the scene manifest, navigation-grid JSON and POI JSON consumed by the Mayalok browser viewer.</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#0a86c2"/></marker><style>.bg{fill:#ffffff}.card{fill:#f4f8fc;stroke:#9fb3c8;stroke-width:2}.head{fill:#eaf4fb;stroke:#0a86c2;stroke-width:2}.h{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f1b2d}.s{font:15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#3d4f66}.m{font:14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#4a5d75}.k{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2px;fill:#0a86c2}.a{fill:none;stroke:#0a86c2;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#6a4cdb;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs><rect class="bg" width="1600" height="940"/><text x="64" y="68" class="k">DATA MODEL</text><text x="64" y="112" class="h" font-size="38">Runtime schemas written by the pipeline</text><text x="64" y="144" class="s">Types mirror `web/src/types.ts`; tuple coordinates use metres in the +Y-up frame.</text>
<g><rect x="64" y="204" width="456" height="620" rx="10" class="card"/><rect x="64" y="204" width="456" height="76" rx="10" class="head"/><text x="92" y="252" class="h">scene.json · SceneManifest</text><text x="92" y="320" class="m">id: string · name: string · version: number</text><text x="92" y="356" class="m">frame: { units: "meters", up: "+y", floorY }</text><text x="92" y="392" class="m">files: { splat, navgrid, minimap, pois }</text><text x="92" y="428" class="m">bounds: { min: Vec3, max: Vec3 }</text><text x="92" y="464" class="m">minimap: { origin: Vec2, metersPerPixel }</text><text x="92" y="500" class="m">eyeHeight: number  // default 1.6</text><text x="92" y="536" class="m">spawn: { position: Vec3, yaw: number }</text><text x="92" y="572" class="m">anchors: Anchor[] · trajectory: Vec2[]</text><text x="92" y="608" class="m">stats: Record&lt;string, unknown&gt;</text><text x="92" y="692" class="k">REFERENCES</text><text x="92" y="724" class="s">file names for splat, grid, minimap and POIs</text></g>
<g><rect x="572" y="204" width="456" height="620" rx="10" class="card"/><rect x="572" y="204" width="456" height="76" rx="10" class="head"/><text x="600" y="252" class="h">navgrid.json · NavGridData</text><text x="600" y="320" class="m">version: number</text><text x="600" y="356" class="m">resolution: number  // 0.05 m default</text><text x="600" y="392" class="m">origin: Vec2 · cols: number · rows: number</text><text x="600" y="428" class="m">agentRadius: number  // 0.25 m default</text><text x="600" y="464" class="m">encoding: "base64-uint8-rowmajor"</text><text x="600" y="500" class="m">walkable: string  // base64 bytes</text><text x="600" y="536" class="m">clearanceCm: string  // base64 bytes</text><text x="600" y="612" class="k">CONSUMED AS</text><text x="600" y="644" class="s">NavGrid.fromJSON() for collision, A*,</text><text x="600" y="672" class="s">visibility and nearest-walkable lookup</text></g>
<g><rect x="1080" y="204" width="456" height="620" rx="10" class="card"/><rect x="1080" y="204" width="456" height="76" rx="10" class="head"/><text x="1108" y="252" class="h">pois.json · PoiFile</text><text x="1108" y="320" class="m">version: 1</text><text x="1108" y="356" class="m">pois: Poi[]</text><text x="1108" y="412" class="k">Poi</text><text x="1108" y="446" class="m">id · name · category: string</text><text x="1108" y="482" class="m">tags?: string[] · description?: string</text><text x="1108" y="518" class="m">position: Vec3  // label anchor</text><text x="1108" y="554" class="m">zone?: Vec2[] | null  // floor polygon</text><text x="1108" y="636" class="k">CONSUMED AS</text><text x="1108" y="668" class="s">Fuse.js search, PoiLayer labels / zones,</text><text x="1108" y="696" class="s">PoiCard and Minimap markers</text></g>
<path d="M520 390H572" class="a"/><text x="526" y="372" class="s">files.navgrid</text><path d="M1028 462H1080" class="a"/><text x="1034" y="444" class="s">files.pois</text><path d="M292 824V866H800V824" class="d"/><text x="506" y="898" class="s">All coordinates share the manifest frame: metres, +Y up, floor at Y=0.</text></svg>
